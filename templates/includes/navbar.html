<header class="navbar" role="banner">
  <div class="container nav-container">
    <div style="display: flex; align-items: center;">
      <a href="{% url 'home' %}" class="brand-logo" aria-label="StreamFlix Home">
        <svg class="logo-icon" viewBox="0 0 24 24" fill="currentColor">
          <polygon points="5 3 19 12 5 21 5 3"></polygon>
        </svg>
        <span>STREAM<span class="logo-accent">FLIX</span></span>
      </a>

      <nav role="navigation" aria-label="Main Navigation">
        <ul class="nav-links">
          <li>
            <a href="{% url 'home' %}" class="nav-link {% if request.resolver_match.url_name == 'home' %}active{% endif %}">Home</a>
          </li>
          <li>
            <a href="{% url 'discover' %}" class="nav-link {% if request.resolver_match.url_name == 'discover' %}active{% endif %}">Discover</a>
          </li>
          <li>
            <a href="{% url 'my_list' %}" class="nav-link {% if request.resolver_match.url_name == 'my_list' %}active{% endif %}">
              My List
              {% if my_list_count > 0 %}
                <span class="badge badge-warning my-list-counter" style="margin-left: 0.35rem; padding: 0.15rem 0.45rem; font-size: 0.72rem;">{{ my_list_count }}</span>
              {% endif %}
            </a>
          </li>
          <li>
            <a href="{% url 'faq' %}" class="nav-link {% if request.resolver_match.url_name == 'faq' %}active{% endif %}">FAQ</a>
          </li>
          <li>
            <a href="{% url 'support' %}" class="nav-link {% if request.resolver_match.url_name == 'support' or request.resolver_match.url_name == 'ticket_detail' %}active{% endif %}">Support Desk</a>
          </li>
        </ul>
      </nav>
    </div>

    <div class="nav-actions">
      <!-- Search shortcut -->
      <a href="{% url 'discover' %}" class="nav-search-btn" title="Search Movies" aria-label="Search Movies">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </a>

      {% if user.is_authenticated %}
        <!-- User Menu Dropdown -->
        <div class="user-menu-wrapper">
          <button class="user-menu-btn" aria-haspopup="true" aria-expanded="false" aria-label="User Account Menu">
            <div class="user-avatar">{{ user.username|slice:":1" }}</div>
            <span class="user-name">{{ user.username }}</span>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </button>

          <div class="dropdown-menu" role="menu">
            <div style="padding: 0.5rem 0.85rem; font-size: 0.8rem; color: var(--text-muted);">
              Signed in as <strong style="color: var(--text-primary); display: block;">{{ user.username }}</strong>
            </div>
            <div class="dropdown-divider"></div>
            <a href="{% url 'profile' %}" class="dropdown-item" role="menuitem">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
              Account Profile
            </a>
            <a href="{% url 'my_list' %}" class="dropdown-item" role="menuitem">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>
              My Saved Movies
            </a>
            <a href="{% url 'support' %}" class="dropdown-item" role="menuitem">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
              My Support Tickets
            </a>
            <div class="dropdown-divider"></div>
            <form action="{% url 'logout' %}" method="POST" style="margin: 0;">
              {% csrf_token %}
              <button type="submit" class="dropdown-logout-btn" role="menuitem">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                Sign Out
              </button>
            </form>
          </div>
        </div>
      {% else %}
        <!-- Guest Authentication Links -->
        <a href="{% url 'login' %}" class="btn btn-ghost btn-sm">Sign In</a>
        <a href="{% url 'signup' %}" class="btn btn-primary btn-sm">Sign Up</a>
      {% endif %}

      <!-- Mobile menu trigger -->
      <button class="mobile-nav-toggle" aria-label="Toggle navigation menu" aria-expanded="false">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>
    </div>
  </div>
</header>
